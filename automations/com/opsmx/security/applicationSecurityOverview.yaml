apiVersion: automation.opsmx.io/v1
kind: Automation
name: Application security overview
description: Summarises the active security issues of one application by category and severity, and suggests where to start. Read-only.
functions: [Vulnerability response]
personas: [Security engineer, Engineering manager]
requests:
  - Report the active security issues of the application {{application}}, grouped by category and severity.
  - From that report, name the three issues to deal with first and say why. Do not change anything.
